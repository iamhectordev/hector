- slug: web
  title: Web
  description: Hector reads and searches the open web to ground responses in current
    information
  status: open
  priority: P1
  open_questions: []
  children:
  - slug: web.fetch
    title: Web Fetch
    description: Hector fetches a URL and returns clean, readable content
    status: idea
    priority: P1
    stories:
    - Hector fetches a URL and returns the main content as markdown
    - Hector strips navigation, ads, and boilerplate from HTML pages
    - Hector uses a page-declared markdown alternate when one is available
    - Hector passes non-HTML text content (markdown, plain text) through unchanged
    - Hector refuses unsafe targets — private addresses, binary content, oversize
      responses
    - Hector reports the final URL after redirects so it can cite accurately
    - Hector returns typed errors so the model can decide whether to retry, escalate,
      or give up
    open_questions:
    - When article extraction trims too much, should the agent get a raw-fetch escape
      hatch as a separate web_fetch_raw tool?
    children: []
  - slug: web.search
    title: Web Search
    description: Hector searches the open web through configured providers and returns
      provider-neutral results for grounding current information.
    status: idea
    priority: P1
    stories:
    - Hector searches the web for current information.
    - Hector returns search results with titles, URLs, snippets, and provider names.
    - Admins configure the web search provider.
    - Hector supports Tavily as a web search provider.
    - Hector supports Exa as a web search provider.
    - Hector supports Brave Search API as a web search provider.
    - Hector reports clear errors when web search is unavailable, unauthorized, rate-limited,
      or unconfigured.
    - Hector can fetch selected search results separately through web_fetch.
    nfrs:
    - Provider credentials never appear in logs, events, tool output, or model context.
    - Provider-specific errors are sanitized before crossing the tool boundary.
    - Tool output uses a provider-neutral result shape, not raw provider responses.
    open_questions:
    - Which provider should be implemented first?
    children: []
