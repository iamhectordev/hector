  description: Internal developer tooling — traces and metrics for debugging and tuning
  status: open
  priority: P1
  open_questions: []
  children:
  - slug: observability.traces
    title: Traces
    description: OpenTelemetry traces across all agent operations
    status: idea
    priority: P1
    stories:
    - All agent operations emit OpenTelemetry traces
    - Developers can trace exactly what happened inside a Hector session
    open_questions: []
    children: []
  - slug: observability.metrics
    title: Metrics
    description: Key performance and quality metrics for tuning
    status: idea
    priority: P1
    stories:
    - Key metrics are available for latency, token usage, and tool call rates
    - Metrics feed into tuning and alerting workflows
    open_questions: []
    children: []
  - slug: observability.evals
    title: Evaluations
    description: Developers evaluate Hector agent quality using Harbor — write YAML
      cases, run them, get scored results
    status: idea
    priority: P1
    stories:
    - Developers write eval cases in YAML — prompt, optional attachments by path,
      and judge config with rubric criteria
    - Hector emits an ATIF-compatible trajectory when run with --trajectory-out, capturing
      the prompt, tool calls with args, tool results, and final response
    - Eval sessions are isolated — no side effects to production memory, sessions,
      or integrations
    - Developers run eval cases via Harbor and get per-case pass/fail results with
      per-criterion scores
    - Eval runs produce structured exit codes so they can run in CI
    nfrs:
    - No overhead when --trajectory-out is absent — trajectory recording is off by
      default
    - Trajectory output is ATIF-compatible so Harbor can consume it without transformation
    open_questions:
    - Should multi-turn eval (scripted turns or LLM-simulated user) be scoped into
      a follow-on feature, or noted as a known extension point here?
    children: []
