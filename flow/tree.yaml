  status: open
  priority: P0
  open_questions: []
  children:
  - slug: mem.episodic_recall
    title: Episodic Recall
    description: Hector recognizes patterns across time and surfaces relevant past
      context
    status: idea
    priority: P0
    stories:
    - Hector notices when the same issue has come up before and says so
    - Hector surfaces relevant past context unprompted when it seems useful
    - Hector flags recurring problems and suggests fixing them at the source
    open_questions: []
    children: []
  - slug: mem.continuous_learning
    title: Continuous Learning
    description: Hector learns team conventions and preferences from interactions
      over time
    status: idea
    priority: P0
    stories:
    - Hector learns team conventions from repeated interactions and applies them without
      being told
    - Hector gets better at tasks the more context it accumulates over time
    - Hector picks up on preferred formats, terminology, and practices organically
    open_questions: []
    children: []
  - slug: mem.retrieval
    title: Org Knowledge Retrieval
    description: Hector recalls documented facts about the org and surfaces them when
      relevant
    status: idea
    priority: P0
    stories:
    - Hector recalls facts about an entity when its name is mentioned. For example,
      asking what language the auth service uses returns the answer without further
      explanation.
    - Hector recalls facts about an entity even when it is not directly named. For
      example, asking what our VCS is returns GitHub even though the stored fact says
      we host code on GitHub.
    - Hector surfaces connections between entities when they are relevant. For example,
      asking who works on auth returns people known to be associated with it.
    open_questions: []
    children: []
  - slug: mem.integrity
    title: Knowledge Integrity
    description: Hector is honest about the quality, currency, and absence of what
      it knows
    status: idea
    priority: P0
    stories:
    - Hector qualifies recalled facts by how it knows them. For example, something
      reported in Slack is presented as reported, not as verified fact.
    - Hector returns the current state of a fact, not a superseded one. For example,
      if a practice changed, Hector reflects the new one.
    - Hector says when it has no documented knowledge rather than guessing. For example,
      asking about our gRPC policy returns no documented position if none exists.
    open_questions: []
    children: []
