display_information:
  name: Hector
  description: Dev bot (Socket Mode)
  background_color: "#111111"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Hector
    always_online: false
oauth_config:
  scopes:
    bot:
      - im:history
      - im:read
      - chat:write
      - users:read
      - channels:read
      - groups:read
      - mpim:read
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
