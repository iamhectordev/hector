- slug: presence
  title: Presence
  description: How Hector shows up, communicates, and reads the room
  status: open
  priority: P0
  open_questions: []
  children:
    - slug: presence.tone_adaptation
      title: Tone Adaptation
      description: Hector matches tone and format to the context and medium
      status: idea
      priority: P0
      stories:
        - Hector reads the room and matches tone — casual one-liner in a thread, structured in an announcement
        - Hector formats output for the medium — Slack reply vs PR comment vs README
      open_questions: []
      children: []
    - slug: presence.message_timing
      title: Message Timing and Steering
      description: Hector knows when to wait, when to respond, and when to steer
      status: idea
      priority: P0
      stories:
        - Hector waits when a user is sending multiple messages before jumping in
        - Hector detects when steering the conversation is better than answering directly
        - Hector batches and queues messages when responding immediately would be premature
      open_questions: []
      children: []
    - slug: presence.follow_up
      title: Proactive Follow-up
      description: Hector returns to threads it missed or where the outcome is unknown
      status: idea
      priority: P0
      stories:
        - Hector returns to threads it missed and contributes if still relevant
        - Hector checks back on open issues to ask if they were resolved
        - Hector notices when a conversation went quiet without resolution and re-engages
      open_questions: []
      children: []
    - slug: presence.human_likeness
      title: Human Likeness
      description: Hector feels like a colleague, not a bot responding to commands
      status: idea
      priority: P0
      stories:
        - Hector initiates when it has something genuinely useful to contribute
        - Hector never feels like a bot waiting to be commanded
      open_questions: []
      children: []

- slug: sessions
  title: Sessions
  description: How Hector tracks, links, and switches between units of ongoing work
  status: open
  priority: P0
  open_questions: []
  children:
    - slug: sessions.lifecycle
      title: Session Lifecycle
      description: Sessions are created, anchored to a thread, and closed when work is done
      status: idea
      priority: P0
      stories:
        - A session starts when Hector is engaged in a thread or conversation
        - Sessions persist with best-effort continuity across restarts
      open_questions: []
      children: []
    - slug: sessions.linking
      title: Session Linking
      description: Sessions across integrations can be linked into one piece of work
      status: idea
      priority: P0
      stories:
        - Dropping a PR link in a Slack thread connects the two into one session
        - Hector suggests linking when it infers two threads are about the same work
        - Links can be made explicitly by the user, suggested by Hector, or inferred automatically
      open_questions: []
      children: []
    - slug: sessions.switching
      title: Session Switching
      description: Hector handles multiple open sessions and moves between them fluidly
      status: idea
      priority: P0
      stories:
        - Hector handles multiple open sessions simultaneously without losing context
        - Hector jumps to another session, does something, and returns — context is never lost
        - Hector can shift focus fully to a new session when appropriate
      open_questions: []
      children: []
    - slug: sessions.compaction
      title: Session Compaction
      description: Session history is actively maintained to stay useful, not just accurate
      status: idea
      priority: P0
      stories:
        - Hector continuously compacts session history as understanding evolves
        - Hector annotates, restructures, and edits session history to serve the current work
        - Hector keeps a floating reminder at the end of a session when something must not be forgotten
      open_questions: []
      children: []

- slug: mem
  title: Memory
  description: How Hector builds and retrieves knowledge about systems, people, and past events
  status: open
  priority: P0
  open_questions: []
  children:
    - slug: mem.entity_recognition
      title: Entity Recognition
      description: Hector resolves terms, people, and projects from accumulated knowledge
      status: idea
      priority: P0
      stories:
        - When I mention a term Hector has learned, it understands without me explaining
        - When I mention a repo by nickname, Hector resolves which one without asking
        - When I mention a person, Hector knows their role and has prior context on them
      open_questions: []
      children: []
    - slug: mem.people_awareness
      title: People Awareness
      description: Hector knows who it is talking to and accumulates experience with people over time
      status: idea
      priority: P0
      stories:
        - Hector knows when it is talking to someone for the first time
        - Hector records experiences with people and uses them to calibrate future interactions
        - Hector understands a person's role and adjusts how it communicates accordingly
      open_questions: []
      children: []
    - slug: mem.episodic_recall
      title: Episodic Recall
      description: Hector recognizes patterns across time and surfaces relevant past context
      status: idea
      priority: P0
      stories:
        - Hector notices when the same issue has come up before and says so
        - Hector surfaces relevant past context unprompted when it seems useful
        - Hector flags recurring problems and suggests fixing them at the source
      open_questions: []
      children: []
    - slug: mem.continuous_learning
      title: Continuous Learning
      description: Hector learns team conventions and preferences from interactions over time
      status: idea
      priority: P0
      stories:
        - Hector learns team conventions from repeated interactions and applies them without being told
        - Hector gets better at tasks the more context it accumulates over time
        - Hector picks up on preferred formats, terminology, and practices organically
      open_questions: []
      children: []

- slug: policies
  title: Policies
  description: Expressive access control — who can interact with Hector, how, and with what tools
  status: open
  priority: P0
  open_questions: []
  children:
    - slug: policies.access_control
      title: Access Control
      description: Admins define who can interact with Hector and through which sources and channel types
      status: idea
      priority: P0
      stories:
        - Admins configure which users can interact with Hector
        - Admins specify allowed sources per user — Slack, GitHub PR comments, JIRA, etc.
        - Admins restrict channel types — threads only, no DMs, public channels only
        - Policies are expressive, validated quickly, and produce clear errors
      open_questions: []
      children: []
    - slug: policies.tool_permissions
      title: Tool Permissions
      description: Admins control which tools each user can trigger, using read/write tags
      status: idea
      priority: P0
      stories:
        - Tools are tagged read or write and policies can reference those tags
        - Admins define which tools each user or role can invoke
        - A user can be limited to read-only tools or a specific integration's tools
      open_questions: []
      children: []
    - slug: policies.account_routing
      title: Account Routing
      description: Policies assign the right account or token to each tool call based on user and context
      status: idea
      priority: P0
      stories:
        - Admins assign accounts or tokens to teams or individual users
        - When Hector calls a tool, the correct account is selected by policy automatically
        - Users can configure their own account so Hector acts on their behalf for write operations
      open_questions: []
      children: []

- slug: approvals
  title: Approvals
  description: Hector asks before it acts on anything that matters
  status: open
  priority: P0
  open_questions: []
  children:
    - slug: approvals.write_review
      title: Write Operation Review
      description: Almost every write operation requires a human sign-off before Hector executes
      status: idea
      priority: P0
      stories:
        - Hector does not execute write operations without explicit approval
        - Approvals can be required by policy or triggered by Hector's own judgment
      open_questions: []
      children: []
    - slug: approvals.conversational
      title: Conversational Approval
      description: Hector previews its intended action in the conversation and waits for a go-ahead
      status: idea
      priority: P0
      stories:
        - Hector shows what it is about to do in plain language and waits for confirmation
        - The user can adjust, reject, or approve directly in the thread
      open_questions: []
      children: []
    - slug: approvals.structured
      title: Structured Approval
      description: Hector presents a structured approval screen for high-stakes or complex actions
      status: idea
      priority: P0
      stories:
        - For complex actions, Hector presents structured fields for the user to review before confirming
        - The approval screen shows exactly what will happen — no surprises after confirmation
      open_questions: []
      children: []

- slug: isolation
  title: Isolation
  description: Strict separation of data and context across tenants, users, and agents
  status: open
  priority: P0
  open_questions: []
  children:
    - slug: isolation.tenant
      title: Tenant Separation
      description: No information leaks between tenants under any circumstances
      status: idea
      priority: P0
      stories:
        - No data, memory, or context ever crosses tenant boundaries
        - Anonymous cross-tenant experience transfer may be enabled in future — without any identifying information
      open_questions: []
      children: []
    - slug: isolation.user
      title: User Permission Isolation
      description: Hector respects user permission levels and does not surface data users cannot access
      status: idea
      priority: P0
      stories:
        - Hector does not expose data to users who lack permission to see it
        - When Hector accesses a system on behalf of a user, it uses that user's access level
      open_questions: []
      children: []
    - slug: isolation.agent
      title: Agent Context Isolation
      description: Agent sessions and memory are not shared between agents unless explicitly configured
      status: idea
      priority: P1
      stories:
        - Agent A does not load Agent B's sessions or memory unless sharing is configured
        - Isolation between agents is about relevance and correctness, not just security
      open_questions: []
      children: []

- slug: security
  title: Security
  description: Protecting against injection, credential misuse, and unauthorized tool use
  status: open
  priority: P0
  open_questions: []
  children:
    - slug: security.prompt_injection
      title: Prompt Injection Defense
      description: Hector detects and resists prompt injection attempts from external content
      status: idea
      priority: P0
      stories:
        - Hector does not follow instructions embedded in external content it reads
        - Hector flags suspected injection attempts and escalates rather than complying
      open_questions: []
      children: []
    - slug: security.credential_handling
      title: Credential Handling
      description: Customer credentials are stored and accessed securely and never leak into context
      status: idea
      priority: P0
      stories:
        - Tokens and credentials are never exposed in logs, session history, or model context
        - Credentials are stored securely and accessed only at the point of use
      open_questions: []
      children: []
    - slug: security.tool_auth
      title: Tool Authorization
      description: Tools can only be invoked by verified, authorized agents
      status: idea
      priority: P0
      stories:
        - Tool calls are authenticated — a rogue or injected agent cannot invoke tools freely
        - Every tool invocation is tied to an authorized agent identity
      open_questions: []
      children: []

